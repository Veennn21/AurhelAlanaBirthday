<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AurhelAlanaBirthday</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Homemade+Apple&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="paper heart cake">
  <img src="image/cake.webp">

  <svg class="circle-text" viewBox="0 0 200 200">
    <defs>
      <path
        id="topText"
        d="M 15,100 A 85,85 0 0,1 185,100"
      />

      <path
        id="bottomText"
        d="M 15,100 A 85,85 0 0,0 185,100"
      />
    </defs>

    <text class="top-text">
      <textPath
        href="#topText"
        startOffset="50%"
        text-anchor="middle">
        Happy Birthday
      </textPath>
    </text>

    <text class="bottom-text">
      <textPath
        href="#bottomText"
        startOffset="50%"
        text-anchor="middle">
        Aurhel Alana
      </textPath>
    </text>
  </svg>
</div>
  <div class="paper image">
    <p>Wish you all the best</p>
    <img src="image/1.jpeg" />
    <p>and keep chasing your dreams!</p>
  </div>

  <div class="paper image">
    <p>Stay healthy & happy!</p>
    <img src="image/4.jpeg" />
  </div>

  <div class="paper image">
    <p>Keep shining, Aurhel Alana</p>
    <img src="image/3.jpeg" />
  </div>

  <div class="paper image">
    <p class="p1">Stay happy always!</p>
    <img src="image/6.jpeg">
    <p class="p2">Wishing you endless happiness!</p>
  </div>

  <div class="paper image">
    <p>Happy Birthday</p>
    <img src="image/7.jpeg">
    <p>Aurhel Alana </p>
  </div>

  <div class="paper instruction">
    <p class="p1">Drag the papers to move!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
